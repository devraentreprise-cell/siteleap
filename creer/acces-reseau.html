<style>
.screen { display: none; }
.screen.active { display: block; }
#acces-reseau {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    min-height: 100%;
}

.page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 0 22px;
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 10;
}
.back-btn {
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #0b1220;
    transition: background-color .15s ease;
}
.back-btn:hover { background: #f1f5f9; }
.back-btn:active { transform: scale(.95); }
.back-btn svg {
    width: 24px; height: 24px;
    stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}
.page-title-wrap {
    flex: 1;
    min-width: 0;
    border-left: 2px solid #10b981;
    padding-left: 14px;
}
.page-title {
    font-size: 1.15rem;
    font-weight: 800;
    color: #0b1220;
    line-height: 1.15;
    letter-spacing: -0.025em;
    margin: 0 0 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.page-sub {
    font-size: 0.78rem;
    font-weight: 450;
    color: #64748b;
    line-height: 1.35;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ⭐ TEXTE D'INTRO — écart quasi nul */
.state-intro {
    font-size: 0.88rem;
    color: #64748b;
    margin: 4px 0 0;
    line-height: 1.5;
    text-align: center;
}

<script>
(function() {

    const AR_DIAGRAM_W = 400, AR_DIAGRAM_H = 300;

    function fitArDiagram() {
        const wrap = document.getElementById('arDiagramWrap');
        const scaler = document.getElementById('arDiagramScaler');
        if (!wrap || !scaler) return;
        const aw = wrap.clientWidth, ah = wrap.clientHeight;
        if (aw <= 0 || ah <= 0) return;
        const scale = Math.min(aw / AR_DIAGRAM_W, ah / AR_DIAGRAM_H, 1.6);
        scaler.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    function applyArDiagram(mode) {
        const d = document.getElementById('arDiagram');
        if (!d) return;
        const allowed = ['memoire', 'priorite', 'internet'];
        const newMode = allowed.indexOf(mode) !== -1 ? mode : 'memoire';
        d.dataset.mode = newMode;
    }

    const LABELS = {
        'memoire':  'Mémoire de l\'appareil',
        'priorite': 'Internet en priorité',
        'internet': 'Internet uniquement'
    };

    function mettreAJourLabel(valeur) {
        const el = document.getElementById('accesReseauValue');
        if (!el) return;
        el.textContent = LABELS[valeur] || LABELS['memoire'];
    }

    async function initAccesReseau() {
        let saved = 'memoire';
        try {
            const lu = await recupererNatif('accesReseau');
            if (lu === 'memoire' || lu === 'priorite' || lu === 'internet') saved = lu;
        } catch (e) {}

        const radio = document.querySelector('input[name="accesReseauOption"][value="' + saved + '"]');
        if (radio) radio.checked = true;

        applyArDiagram(saved);
        mettreAJourLabel(saved);

        setTimeout(fitArDiagram, 60);
    }

    document.querySelectorAll('input[name="accesReseauOption"]').forEach(function(r) {
        r.addEventListener('change', async function() {
            const valeur = this.value;
            try { await stockerNatif('accesReseau', valeur); } catch (e) {}
            applyArDiagram(valeur);
            mettreAJourLabel(valeur);
        });
    });

    window.addEventListener('resize', function() {
        const el = document.getElementById('acces-reseau');
        if (el && el.classList.contains('active')) {
            fitArDiagram();
        }
    });

    window.init_acces_reseau = initAccesReseau;

    initAccesReseau();

})();
</script>
