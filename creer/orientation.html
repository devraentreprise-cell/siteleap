<script>
(function() {

    let orientCurrentMode = 'portrait';
    let orientIsAnimating = false;
    const ORIENT_ROTATION_MS = 500;

    function orientSleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function contrastColor(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum > 0.55 ? '#0f172a' : '#ffffff';
    }

    /* ⭐ Iframe neuve */
    function creerIframeNeuve() {
        const container = document.getElementById('orientScreen');
        if (!container) return null;
        const ancienne = document.getElementById('orientIframe');
        if (ancienne) ancienne.remove();
        const iframe = document.createElement('iframe');
        iframe.id = 'orientIframe';
        iframe.className = 'dm-iframe hidden';
        iframe.setAttribute('sandbox', 'allow-same-origin');
        container.appendChild(iframe);
        return iframe;
    }

    function fitOrientIframe() {
        const screenEl = document.getElementById('orientScreen');
        const iframe = document.getElementById('orientIframe');
        if (!screenEl || !iframe) return;
        if (iframe.classList.contains('hidden')) return;
        const screenW = screenEl.clientWidth;
        const screenH = screenEl.clientHeight;
        if (screenW <= 0 || screenH <= 0) return;

        const siteW = 375, siteH = 812;
        iframe.style.position = 'absolute';
        iframe.style.width = siteW + 'px';
        iframe.style.height = siteH + 'px';
        iframe.style.left = '0';
        iframe.style.top = '0';
        iframe.style.transformOrigin = 'top left';
        iframe.style.border = 'none';
        iframe.style.pointerEvents = 'none';
        iframe.style.display = 'block';
        iframe.style.background = '#ffffff';

        if (orientCurrentMode === 'landscape') {
            const s = screenW / siteW;
            iframe.style.transform = 'scale(' + s + ')';
        } else {
            const sx = screenW / siteW;
            const sy = screenH / siteH;
            iframe.style.transform = 'scale(' + sx + ', ' + sy + ')';
        }
    }

    /* ⭐ Applique le mode sans changer la taille visuelle du téléphone */
    function applyOrientMode(mode, animate) {
        const phoneEl = document.getElementById('orientPhone');
        if (!phoneEl) return;
        const targetAspect = (mode === 'landscape') ? '16 / 9' : '9 / 16';
        const targetHeight = (mode === 'landscape') ? '191px' : '340px';

        if (!animate) {
            phoneEl.style.transition = 'none';
            phoneEl.style.transform = 'rotate(0deg)';
            phoneEl.style.aspectRatio = targetAspect;
            phoneEl.style.height = targetHeight;
            void phoneEl.offsetWidth;
            phoneEl.style.transition = '';
            orientCurrentMode = mode;
            setTimeout(fitOrientIframe, 60);
            setTimeout(fitOrientIframe, 200);
            return;
        }

        (async () => {
            if (orientIsAnimating || orientCurrentMode === mode) return;
            orientIsAnimating = true;

            const angle = (mode === 'landscape') ? -90 : 90;

            phoneEl.style.transition = 'transform ' + ORIENT_ROTATION_MS + 'ms cubic-bezier(0.34, 1, 0.64, 1)';
            phoneEl.style.transform = 'rotate(' + angle + 'deg)';

            await orientSleep(ORIENT_ROTATION_MS + 30);

            phoneEl.style.transition = 'none';
            phoneEl.style.transform = 'rotate(0deg)';
            phoneEl.style.aspectRatio = targetAspect;
            phoneEl.style.height = targetHeight;
            void phoneEl.offsetWidth;
            phoneEl.style.transition = '';

            orientCurrentMode = mode;
            orientIsAnimating = false;
            setTimeout(fitOrientIframe, 60);
            setTimeout(fitOrientIframe, 200);
        })();
    }

    function guessMime(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        const map = { 'html':'text/html','htm':'text/html','css':'text/css','js':'application/javascript','mjs':'application/javascript','json':'application/json','svg':'image/svg+xml','png':'image/png','jpg':'image/jpeg','jpeg':'image/jpeg','gif':'image/gif','webp':'image/webp','bmp':'image/bmp','ico':'image/x-icon','woff':'font/woff','woff2':'font/woff2','ttf':'font/ttf','otf':'font/otf','eot':'application/vnd.ms-fontobject','mp4':'video/mp4','webm':'video/webm','mp3':'audio/mpeg','wav':'audio/wav','ogg':'audio/ogg' };
        return map[ext] || 'application/octet-stream';
    }

    async function buildSiteBlobUrl() {
        const files = await recupererNatif('files_data') || [];
        if (files.length === 0) return null;

        let mainFile = null;
        const prefIndex = await recupererNatif('indexPrefere');
        if (prefIndex !== null && prefIndex !== undefined && files[prefIndex] && files[prefIndex].name.toLowerCase().endsWith('.html')) {
            mainFile = files[prefIndex];
        } else {
            const htmlFiles = files.filter(f => f.name.toLowerCase().endsWith('.html'));
            if (htmlFiles.length === 0) return null;
            mainFile = htmlFiles.find(f => /^index\.html?$/i.test(f.name)) || htmlFiles[0];
        }

        const mainDir = mainFile.webkitRelativePath ? mainFile.webkitRelativePath.split('/').slice(0, -1).join('/') + '/' : '';
        const urlMap = new Map();
        function addUrl(key, url) { if (key) urlMap.set(key, url); }

        for (const f of files) {
            const mime = f.type || guessMime(f.name);
            const blob = new Blob([f.buffer], { type: mime });
            const url = URL.createObjectURL(blob);
            addUrl(f.name, url);
            if (f.webkitRelativePath) {
                addUrl(f.webkitRelativePath, url);
                if (mainDir && f.webkitRelativePath.startsWith(mainDir)) addUrl(f.webkitRelativePath.substring(mainDir.length), url);
                const parts = f.webkitRelativePath.split('/');
                if (parts.length > 1) addUrl(parts.slice(1).join('/'), url);
            }
        }

        function resolveUrl(path, baseDir) {
            if (!path) return null;
            if (/^(https?:|data:|blob:|#|mailto:|tel:|javascript:|\/\/)/i.test(path)) return null;
            let clean = path.replace(/^\.\//, '').replace(/^\//, '');
            if (baseDir) { const withBase = baseDir + clean; if (urlMap.has(withBase)) return urlMap.get(withBase); }
            if (urlMap.has(clean)) return urlMap.get(clean);
            const basename = clean.split('/').pop();
            if (urlMap.has(basename)) return urlMap.get(basename);
            return null;
        }

        const htmlText = new TextDecoder().decode(mainFile.buffer);
        const rewrittenHtml = htmlText.replace(/(\s(?:src|href|poster|data-src)\s*=\s*)(["'])([^"']+)\2/gi, (match, prefix, quote, path) => {
            const url = resolveUrl(path, mainDir);
            if (url) return prefix + quote + url + quote;
            return match;
        });

        const finalBlob = new Blob([rewrittenHtml], { type: 'text/html' });
        return URL.createObjectURL(finalBlob);
    }

    async function initOrientation() {
        const display = (await recupererNatif('display')) || 'standalone';
        const phoneEl = document.getElementById('orientPhone');
        if (phoneEl) {
            if (display === 'fullscreen') phoneEl.classList.add('fullscreen');
            else phoneEl.classList.remove('fullscreen');
        }
        const themeColor = (await recupererNatif('themeColor')) || '#ffffff';
        const titlebar = document.getElementById('orientTitlebar');
        if (titlebar) {
            titlebar.style.background = themeColor;
            titlebar.style.color = contrastColor(themeColor);
        }

        const saved = (await recupererNatif('orientation')) || 'portrait';
        const radio = document.querySelector('input[name="orientationOption"][value="' + saved + '"]');
        if (radio) radio.checked = true;
        applyOrientMode(saved, false);

        const emptyMsg = document.getElementById('orientEmptyMsg');

        const iframe = creerIframeNeuve();
        const url = await buildSiteBlobUrl();
        if (url) {
            if (emptyMsg) emptyMsg.classList.add('hidden');
            iframe.src = url;
            iframe.classList.remove('hidden');
            setTimeout(fitOrientIframe, 200);
            setTimeout(fitOrientIframe, 500);
        } else {
            if (emptyMsg) emptyMsg.classList.remove('hidden');
            iframe.classList.add('hidden');
        }
    }

    document.querySelectorAll('input[name="orientationOption"]').forEach(r => {
        r.addEventListener('change', async function() {
            await stockerNatif('orientation', this.value);
            applyOrientMode(this.value, true);

            /* ⭐ Mise à jour immédiate de la ligne dans l'écran principal */
            const el = document.getElementById('orientationValue');
            if (el) {
                el.textContent = this.value === 'landscape'
                    ? 'Paysage (horizontal)'
                    : 'Portrait (vertical)';
            }
        });
    });

    window.addEventListener('resize', function() {
        const el = document.getElementById('orientation');
        if (el && el.classList.contains('active')) {
            fitOrientIframe();
        }
    });

    window.init_orientation = initOrientation;

})();
</script>
