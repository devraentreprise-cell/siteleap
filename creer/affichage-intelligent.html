<script>
(function() {

    const AI_DIAGRAM_W = 360, AI_DIAGRAM_H = 440;

    const T_BARRE_OUI = 70;
    const T_SPINNER_NON = 1700;

    function fitAiDiagram() {
        const wrap = document.getElementById('aiDiagramWrap');
        const scaler = document.getElementById('aiDiagramScaler');
        if (!wrap || !scaler) return;
        const aw = wrap.clientWidth, ah = wrap.clientHeight;
        if (aw <= 0 || ah <= 0) return;
        const scale = Math.min(aw / AI_DIAGRAM_W, ah / AI_DIAGRAM_H, 1.6);
        scaler.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    function couleurContraste(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum > 0.55 ? '#0f172a' : '#ffffff';
    }

    function lancerAnimations(mode) {
        const blocsOui = document.querySelectorAll('#aiBlocksOui .ai-blk');
        const blocsNon = document.querySelectorAll('#aiBlocksNon .ai-blk');

        /* Reset */
        blocsOui.forEach(b => b.classList.remove('visible'));
        blocsNon.forEach(b => b.classList.remove('visible'));

        /* Forcer le rejeu du spinner */
        const loader = document.getElementById('aiLoaderNon');
        if (loader) {
            loader.style.animation = 'none';
            void loader.offsetWidth;
            loader.style.animation = '';
        }

        if (mode === 'oui') {
            blocsOui.forEach(function(b, i) {
                setTimeout(function() {
                    b.classList.add('visible');
                }, i * T_BARRE_OUI);
            });
        } else {
            setTimeout(function() {
                blocsNon.forEach(function(b) {
                    b.classList.add('visible');
                });
            }, T_SPINNER_NON);
        }
    }

    function applyAiDiagram(mode) {
        const d = document.getElementById('aiDiagram');
        if (!d) return;
        const newMode = (mode === 'non') ? 'non' : 'oui';
        if (d.dataset.mode === newMode) {
            d.removeAttribute('data-mode');
            void d.offsetWidth;
        }
        d.dataset.mode = newMode;
    }

    async function initAffichageIntelligent() {
        let saved = 'oui';
        try {
            const lu = await recupererNatif('affichageIntelligent');
            if (lu === 'oui' || lu === 'non') saved = lu;
        } catch (e) {}

        const radio = document.querySelector('input[name="affichageOption"][value="' + saved + '"]');
        if (radio) radio.checked = true;

        const themeColor = (await recupererNatif('themeColor')) || '#ffffff';
        const display = (await recupererNatif('display')) || 'standalone';

        ['aiSBOui', 'aiSBNon'].forEach(function(id) {
            const sb = document.getElementById(id);
            if (sb) {
                sb.style.background = themeColor;
                sb.style.color = couleurContraste(themeColor);
            }
        });

        if (display === 'fullscreen') {
            document.querySelectorAll('.ai-phone').forEach(function(p) {
                p.classList.add('no-titlebar');
            });
        } else {
            document.querySelectorAll('.ai-phone').forEach(function(p) {
                p.classList.remove('no-titlebar');
            });
        }

        applyAiDiagram(saved);
        lancerAnimations(saved);

        setTimeout(fitAiDiagram, 60);
    }

    document.querySelectorAll('input[name="affichageOption"]').forEach(function(r) {
        r.addEventListener('change', async function() {
            const valeur = this.value;
            try { await stockerNatif('affichageIntelligent', valeur); } catch (e) {}

            applyAiDiagram(valeur);
            lancerAnimations(valeur);

            const el = document.getElementById('affichageIntelligentValue');
            if (el) {
                el.textContent = valeur === 'non'
                    ? 'Attendre le chargement complet'
                    : 'Afficher progressivement';
            }
        });
    });

    window.addEventListener('resize', function() {
        const el = document.getElementById('affichage-intelligent');
        if (el && el.classList.contains('active')) {
