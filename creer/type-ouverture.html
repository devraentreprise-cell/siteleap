<script>
(function() {

    const TO_DIAGRAM_W = 360, TO_DIAGRAM_H = 440;

    const T_INSTANT = 500;
    const T_NORMAL  = 1600;
    const T_DELAI   = 900;
    const T_BARRE   = 70;

    const LABEL_INSTANT = 'Instantané';
    const LABEL_NORMAL  = 'Normale';

    let logoBlobURL = null;
    let timeoutIds = [];

    function fitToDiagram() {
        const wrap = document.getElementById('toDiagramWrap');
        const scaler = document.getElementById('toDiagramScaler');
        if (!wrap || !scaler) return;
        const aw = wrap.clientWidth, ah = wrap.clientHeight;
        if (aw <= 0 || ah <= 0) return;
        const scale = Math.min(aw / TO_DIAGRAM_W, ah / TO_DIAGRAM_H, 1.6);
        scaler.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    }

    function applyToDiagram(mode) {
        const d = document.getElementById('toDiagram');
        if (!d) return;
        d.dataset.mode = (mode === 'normal') ? 'normal' : 'instant';
    }

    function clearTimeouts() {
        timeoutIds.forEach(function(t) { clearTimeout(t); });
        timeoutIds = [];
    }

    function resetPhone(config) {
        const { splashEl, blocksEl, screenEl, statusbarEl, couleurFond } = config;
        splashEl.classList.remove('hidden');
        splashEl.style.background = couleurFond;
        if (screenEl) screenEl.style.background = couleurFond;
        if (statusbarEl) {
            statusbarEl.style.background = couleurFond;
            statusbarEl.style.color = couleurContraste(couleurFond);
        }
        blocksEl.querySelectorAll('.to-blk').forEach(function(b) {
            b.classList.remove('visible');
        });
    }

    function appliquerCouleurApresSplash(config) {
        const { screenEl, statusbarEl, themeColor } = config;
        if (statusbarEl) {
            statusbarEl.style.background = themeColor;
            statusbarEl.style.color = couleurContraste(themeColor);
        }
        if (screenEl) screenEl.style.background = '#ffffff';
    }

    function jouerSequence(config) {
        const { splashEl, blocksEl, dureeSplash, affichageIntelligent } = config;
        const blocs = blocksEl.querySelectorAll('.to-blk');

        resetPhone(config);

        const t1 = setTimeout(function() {

            if (affichageIntelligent === 'oui') {
                splashEl.classList.add('hidden');
                appliquerCouleurApresSplash(config);
                blocs.forEach(function(b, i) {
                    const t = setTimeout(function() {
                        b.classList.add('visible');
                    }, i * T_BARRE);
                    timeoutIds.push(t);
                });
            } else {
                const t2 = setTimeout(function() {
                    splashEl.classList.add('hidden');
                    appliquerCouleurApresSplash(config);
                    blocs.forEach(function(b) { b.classList.add('visible'); });
                }, T_DELAI);
                timeoutIds.push(t2);
            }
        }, dureeSplash);
        timeoutIds.push(t1);
    }

    function couleurContraste(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum > 0.55 ? '#0f172a' : '#ffffff';
    }

    function mettreAJourLabel(valeur) {
        const el = document.getElementById('typeOuvertureValue');
        if (!el) return;
        el.textContent = (valeur === 'normal') ? LABEL_NORMAL : LABEL_INSTANT;
    }

    async function chargerInfos() {
        let logo = null;
        try { logo = await recupererNatif('logo'); } catch (e) {}

        let couleurFond = '#ffffff';
        try { couleurFond = (await recupererNatif('couleurFond')) || '#ffffff'; } catch (e) {}

        let themeColor = '#ffffff';
        try { themeColor = (await recupererNatif('themeColor')) || '#ffffff'; } catch (e) {}

        let affichageIntelligent = 'oui';
        try {
            const ai = await recupererNatif('affichageIntelligent');
            if (ai === 'oui' || ai === 'non') affichageIntelligent = ai;
        } catch (e) {}

        if (logoBlobURL) { URL.revokeObjectURL(logoBlobURL); logoBlobURL = null; }
        if (logo && logo instanceof Blob) {
            logoBlobURL = URL.createObjectURL(logo);
        }

        const iconInstant = document.getElementById('toSplashIconInstant');
        const iconNormal = document.getElementById('toSplashIconNormal');

        if (logoBlobURL) {
            if (iconInstant) iconInstant.style.backgroundImage = 'url(' + logoBlobURL + ')';
            if (iconNormal) iconNormal.style.backgroundImage = 'url(' + logoBlobURL + ')';
        }

        return { affichageIntelligent, couleurFond, themeColor };
    }

    /* ⭐ Applique ou retire la barre de statut selon le mode d'affichage */
    function appliquerModeAffichage(display) {
        if (display === 'fullscreen') {
            document.querySelectorAll('.to-phone').forEach(function(p) {
                p.classList.add('no-titlebar');
            });
        } else {
            document.querySelectorAll('.to-phone').forEach(function(p) {
                p.classList.remove('no-titlebar');
            });
        }
    }

    async function lancerAnimation(mode) {
        clearTimeouts();
        const infos = await chargerInfos();

        const configInstant = {
            splashEl: document.getElementById('toSplashInstant'),
            blocksEl: document.getElementById('toBlocksInstant'),
            screenEl: document.getElementById('toScreenInstant'),
            statusbarEl: document.getElementById('toSBInstant'),
            dureeSplash: T_INSTANT,
            affichageIntelligent: infos.affichageIntelligent,
            couleurFond: infos.couleurFond,
            themeColor: infos.themeColor
        };
        const configNormal = {
            splashEl: document.getElementById('toSplashNormal'),
            blocksEl: document.getElementById('toBlocksNormal'),
            screenEl: document.getElementById('toScreenNormal'),
            statusbarEl: document.getElementById('toSBNormal'),
            dureeSplash: T_NORMAL,
            affichageIntelligent: infos.affichageIntelligent,
            couleurFond: infos.couleurFond,
            themeColor: infos.themeColor
        };

        resetPhone(configInstant);
        resetPhone(configNormal);

        if (mode === 'normal') {
            jouerSequence(configNormal);
        } else {
            jouerSequence(configInstant);
        }
    }

    async function initTypeOuverture() {
        let saved = 'instant';
        try {
            const lu = await recupererNatif('typeOuverture');
            if (lu === 'instant' || lu === 'normal') saved = lu;
        } catch (e) {}

        const radio = document.querySelector('input[name="typeOuvertureOption"][value="' + saved + '"]');
        if (radio) radio.checked = true;

        applyToDiagram(saved);
        mettreAJourLabel(saved);

        /* ⭐ Appliquer le mode d'affichage (barre visible ou pas) */
        const display = (await recupererNatif('display')) || 'standalone';
        appliquerModeAffichage(display);

        await lancerAnimation(saved);

        setTimeout(fitToDiagram, 60);
    }

    document.querySelectorAll('input[name="typeOuvertureOption"]').forEach(function(r) {
        r.addEventListener('change', async function() {
            const valeur = this.value;
            try { await stockerNatif('typeOuverture', valeur); } catch (e) {}
            applyToDiagram(valeur);
            mettreAJourLabel(valeur);

            await lancerAnimation(valeur);
        });
    });

    window.addEventListener('resize', function() {
        const el = document.getElementById('type-ouverture');
        if (el && el.classList.contains('active')) {
            fitToDiagram();
        }
    });

    window.init_type_ouverture = initTypeOuverture;

    initTypeOuverture();

})();
