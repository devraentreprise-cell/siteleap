<div id="fichiers" class="screen">
    <div class="page-header">
        <button class="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="page-title-wrap">
            <h1 class="page-title">Fichiers sources</h1>
            <p class="page-sub">Le contenu de votre site</p>
        </div>
    </div>

    <!-- ÉTAT VIDE -->
    <div id="filesEmptyState">
        <p class="state-intro">Choisissez le type de document à importer, puis sélectionnez vos fichiers.</p>

        <!-- Segment Dossier / Fichier -->
        <div class="segment-control">
            <input type="radio" name="sourceType" value="dossier" id="srcDossier" checked>
            <label for="srcDossier">Dossier</label>
            <input type="radio" name="sourceType" value="fichier" id="srcFichier">
            <label for="srcFichier">Fichier</label>

        <div id="blocDossier">
            <label class="file-drop">
                <input type="file" id="dossierInput" webkitdirectory multiple>
                <div class="file-drop-icon-wrap">
                    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                </div>
                <div class="file-drop-text">Sélectionner un dossier</div>
                <div class="file-drop-hint">Le dossier complet de votre site</div>
            </label>
        </div>

        <div id="blocFichier" class="hidden">

                    <svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>

                <svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>

            <div class="main-page-card-check">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>

        <div id="mainPageSelectWrapper" class="main-page-select-wrapper hidden">

<script>
/* ============================================================
   ÉCRAN FICHIERS SOURCES — FORMULE PRO
   ============================================================ */
(function() {

    let filesActiveMode = 'dossier';
    let filesData = [];
    let galleryBlobUrls = [];

    function revokeGalleryBlobUrls() {
        galleryBlobUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch (e) {} });
        galleryBlobUrls.length = 0;
    }

    function formatFileSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' o';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
        return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
    }

    function getFileIconSvg(ext) {
        const e = (ext || '').toLowerCase();
        if (e === 'html' || e === 'htm') return '<svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>';
        if (e === 'css') return '<svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 14h8"/><path d="M8 17h5"/></svg>';
        if (e === 'js') return '<svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M10 14v3"/><path d="M14 14v3"/></svg>';
        return '<svg viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>';
    }

    function renderGallery(containerId, files) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        files.forEach(f => {
            const displayName = f.name;
            const ext = (displayName.split('.').pop() || '').toLowerCase();
            const isImage = /^(png|jpg|jpeg|gif|webp|bmp|svg)$/.test(ext);
            let thumbContent;
            if (isImage && f.buffer) {
                try {
                    const blob = new Blob([f.buffer], { type: f.type || 'image/*' });
                    const url = URL.createObjectURL(blob);
                    galleryBlobUrls.push(url);
                    thumbContent = '<img src="' + url + '" alt="">';
                } catch (e) { thumbContent = getFileIconSvg(ext); }
            } else { thumbContent = getFileIconSvg(ext); }

            const el = document.createElement('div');
            el.className = 'gallery-item';
            el.innerHTML =
                '<div class="gallery-thumb">' +
                    thumbContent +
                    (ext ? '<span class="ext-badge ' + ext + '">' + ext.toUpperCase() + '</span>' : '') +
                '</div>' +
                '<div class="gallery-item-info">' +
                    '<div class="gallery-item-name" title="' + displayName + '">' + displayName + '</div>' +
                    '<div class="gallery-item-size">' + formatFileSize(f.buffer ? f.buffer.byteLength : 0) + '</div>' +
                '</div>';
            container.appendChild(el);
        });
    }

    async function refreshFilesScreenUI() {
        revokeGalleryBlobUrls();
        const emptyState = document.getElementById('filesEmptyState');
        const loadingState = document.getElementById('filesLoadingState');
        const filledState = document.getElementById('filesFilledState');
        if (!emptyState) return;

        loadingState.classList.add('hidden');
        const hasSelection = filesData && filesData.length > 0;

        if (!hasSelection) {
            emptyState.classList.remove('hidden');
            filledState.classList.add('hidden');
            const radio = document.querySelector('input[name="sourceType"][value="' + filesActiveMode + '"]');
            if (radio) radio.checked = true;
            document.getElementById('blocDossier').classList.toggle('hidden', filesActiveMode !== 'dossier');
            document.getElementById('blocFichier').classList.toggle('hidden', filesActiveMode !== 'fichier');
            return;
        }

        emptyState.classList.add('hidden');
        filledState.classList.remove('hidden');
        const n = filesData.length;
        document.getElementById('filesCount').textContent = n + ' fichier' + (n > 1 ? 's' : '') + ' importé' + (n > 1 ? 's' : '');

        const htmlFiles = filesData.map((f, idx) => ({ f, idx })).filter(o => o.f.name.toLowerCase().endsWith('.html'));
        const cardEl = document.getElementById('mainPageCard');
        const selectWrap = document.getElementById('mainPageSelectWrapper');

        if (htmlFiles.length === 0) {
            cardEl.classList.add('hidden');
            selectWrap.classList.add('hidden');
        } else if (htmlFiles.length === 1) {
            cardEl.classList.remove('hidden');
            selectWrap.classList.add('hidden');
            selectWrap.classList.remove('has-error');
            document.getElementById('mainPageCardName').textContent = htmlFiles[0].f.name;
            await stockerNatif('indexPrefere', htmlFiles[0].idx);
        } else {
            cardEl.classList.add('hidden');
            selectWrap.classList.remove('hidden');
            const selectEl = document.getElementById('selectHtmlPrincipal');
            selectEl.innerHTML = '';
            const placeholderOpt = document.createElement('option');
            placeholderOpt.value = '';
            placeholderOpt.textContent = '-- Choisissez une page --';
            selectEl.appendChild(placeholderOpt);
            htmlFiles.forEach((o) => {
                const opt = document.createElement('option');
                opt.value = o.idx;
                opt.textContent = o.f.name;
                selectEl.appendChild(opt);
            });
            const prefIndex = await recupererNatif('indexPrefere');
            let isValidPref = false;
            if (prefIndex !== null && prefIndex !== undefined) {
                isValidPref = htmlFiles.some(o => o.idx === prefIndex);
            }
            if (isValidPref) {
                selectEl.value = String(prefIndex);
                selectWrap.classList.remove('has-error');
            } else {
                selectEl.value = '';
                await supprimerNatif('indexPrefere');
            }
        }
        renderGallery('filesGallery', filesData);
    }

    async function showFilesLoading() {
        document.getElementById('filesEmptyState').classList.add('hidden');
        document.getElementById('filesFilledState').classList.add('hidden');
        document.getElementById('filesLoadingState').classList.remove('hidden');
        await new Promise(r => setTimeout(r, 30));
    }

    document.querySelectorAll('input[name="sourceType"]').forEach(radio => {
        radio.addEventListener('change', function() {
            filesActiveMode = this.value;
            document.getElementById('blocDossier').classList.toggle('hidden', filesActiveMode !== 'dossier');
            document.getElementById('blocFichier').classList.toggle('hidden', filesActiveMode !== 'fichier');
        });
    });

    const di = document.getElementById('dossierInput');
    if (di) {
        di.addEventListener('change', async function() {
            const files = Array.from(this.files);
            this.value = '';
            if (files.length === 0) return;
            const hasHtml = files.some(f => f.name.toLowerCase().endsWith('.html'));
            if (!hasHtml) {
                showNotification("Ce dossier ne contient aucun fichier HTML. Un fichier HTML est obligatoire pour générer l'application.", 'error');
                return;
            }
            await showFilesLoading();
            try {
                const converties = [];
                for (let i = 0; i < files.length; i++) {
                    const f = files[i];
                    const buf = await f.arrayBuffer();
                    converties.push({ name: f.name, webkitRelativePath: f.webkitRelativePath || '', buffer: buf, type: f.type });
                }
                filesData = converties;
                await stockerNatif('files_data', converties);
                await stockerNatif('sourceType', 'dossier');
                await supprimerNatif('indexPrefere');
                invalidateSitePreviewCache();
                await refreshFilesScreenUI();
            } catch (err) {
                showNotification('❌ Erreur import dossier : ' + err.message, 'error');
                await refreshFilesScreenUI();
            }
        });
    }

    const fi = document.getElementById('fichierInput');
    if (fi) {
        fi.addEventListener('change', async function() {
            const files = Array.from(this.files);
            this.value = '';
            if (files.length === 0) return;
            const file = files[0];
            if (!file.name.toLowerCase().endsWith('.html')) {
                showNotification('Veuillez sélectionner un fichier .html.', 'error');
                return;
            }
            await showFilesLoading();
            try {
                const buf = await file.arrayBuffer();
                filesData = [{ name: file.name, webkitRelativePath: '', buffer: buf, type: file.type || 'text/html' }];
                await stockerNatif('files_data', filesData);
                await stockerNatif('sourceType', 'fichier');
                await supprimerNatif('indexPrefere');
                invalidateSitePreviewCache();
                await refreshFilesScreenUI();
            } catch (err) {
                showNotification('❌ Erreur import fichier : ' + err.message, 'error');
                await refreshFilesScreenUI();
            }
        });
    }

    const shp = document.getElementById('selectHtmlPrincipal');
    if (shp) {
        shp.addEventListener('change', async function() {
            const wrapper = document.getElementById('mainPageSelectWrapper');
            if (this.value === '') {
                await supprimerNatif('indexPrefere');
            } else {
                await stockerNatif('indexPrefere', parseInt(this.value, 10));
                if (wrapper) wrapper.classList.remove('has-error');
            }
            invalidateSitePreviewCache();
        });
    }

    async function confirmDeleteAllFiles() {
        closeConfirmDeleteAllFiles();
        revokeGalleryBlobUrls();
        filesData = [];
        await supprimerNatif('files_data');
        await supprimerNatif('indexPrefere');
        invalidateSitePreviewCache();
        await refreshFilesScreenUI();
        const rf = document.getElementById('rowFiles');
        if (rf) rf.classList.remove('has-error');
    }

    function invalidateSitePreviewCache() {
        if (typeof window._invalidateSitePreviewCache === 'function') {
            window._invalidateSitePreviewCache();
        }
    }

    /* ⭐ Vérifie en temps réel si l'écran fichiers est valide (pas de blocage nécessaire) */
    function estFichiersValide() {
        const htmlFiles = (filesData || []).filter(f => f.name.toLowerCase().endsWith('.html'));
        if (htmlFiles.length <= 1) return true; // 0 ou 1 fichier : rien à choisir
        const selectEl = document.getElementById('selectHtmlPrincipal');
        if (!selectEl) return true;
        const val = selectEl.value;
        if (val === '') return false;
        const idx = parseInt(val, 10);
        if (isNaN(idx)) return false;
        if (!filesData[idx]) return false;
        return filesData[idx].name.toLowerCase().endsWith('.html');
    }

    async function initFichiers() {
        try {
            filesActiveMode = await recupererNatif('sourceType') || 'dossier';
            filesData = await recupererNatif('files_data') || [];
        } catch (e) {}
        await refreshFilesScreenUI();

        /* ⭐ Enregistrer la garde auprès du shell :
           Bloque la sortie de l'écran fichiers si plusieurs HTML importés
           et qu'aucune page d'accueil principale n'a été choisie */
        if (typeof window.enregistrerGarde === 'function') {
            window.enregistrerGarde('fichiers', function() {
                if (estFichiersValide()) return true;

                /* Blocage : montrer l'erreur */
                const wrap = document.getElementById('mainPageSelectWrapper');
                if (wrap) {
                    wrap.classList.remove('hidden');
                    wrap.classList.add('has-error');
                    if (typeof wrap.scrollIntoView === 'function') {
                        wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
                return false;
            });
        }
    }

    window.init_fichiers = initFichiers;
    window.confirmDeleteAllFiles = confirmDeleteAllFiles;

})();
</script>
