<div id="projets" class="screen active">

    <div class="pj-welcome">
        <div class="pj-welcome-top">
            <div class="pj-avatar" id="pjAvatar">MD</div>
            <div class="pj-welcome-texts">
                <div class="pj-greeting" id="pjGreeting">Bonjour 👋</div>
                <div class="pj-name" id="pjName">Utilisateur</div>
            </div>
        </div>

        <button type="button" class="pj-btn-create" id="pjBtnCreate">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Créer un projet
        </button>
    </div>

    <div class="pj-section-bar">
        <span class="pj-section-titre">Vos projets</span>
        <span class="pj-section-compteur" id="pjCompteur">0</span>
    </div>

    <div id="pjConteneur"></div>

</div>

<style>
#projets { max-width: 640px; width: 100%; margin: 0 auto; padding: 0 0 24px; }

/* ─── ACCUEIL ─── */
.pj-welcome { padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 18px; }
.pj-welcome-top { display: flex; align-items: center; gap: 14px; }
.pj-avatar {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; font-weight: 800; text-transform: uppercase;
    overflow: hidden;
    box-shadow: 0 4px 12px -4px rgba(16,185,129,.55);
}
.pj-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pj-welcome-texts { flex: 1; min-width: 0; }
.pj-greeting { font-size: 0.82rem; color: #64748b; font-weight: 500; margin-bottom: 3px; }
.pj-name {
    font-size: 1.1rem; font-weight: 800; color: #0b1220;
    letter-spacing: -0.02em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pj-btn-create {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 15px 18px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 0.95rem; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 12px 24px -10px rgba(16,185,129,.5), inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .18s ease, filter .18s ease;
}
.pj-btn-create:hover { transform: translateY(-1px); filter: brightness(1.03); }
.pj-btn-create:active { transform: scale(.98); }
.pj-btn-create svg {
    width: 20px; height: 20px; stroke: currentColor; fill: none;
    stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
}

/* ─── BARRE SECTION ─── */
.pj-section-bar {
    padding: 0 16px 12px; display: flex; align-items: center; gap: 10px;
}
.pj-section-titre {
    font-size: 0.72rem; font-weight: 800; color: #64748b;
    letter-spacing: 0.1em; text-transform: uppercase;
}
.pj-section-compteur {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 20px; padding: 0 7px;
    background: #f1f5f9; color: #64748b;
    font-size: 0.7rem; font-weight: 800; border-radius: 6px;
}

/* ─── LISTE PROJETS (style WhatsApp) ─── */
.pj-list { display: flex; flex-direction: column; width: 100%; }
.pj-item {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 12px 16px;
    background: #fff; border: none; border-bottom: 1px solid #f1f5f9;
    font-family: inherit; text-align: left; color: #0b1220;
    cursor: pointer;
    transition: background-color .15s ease;
    -webkit-appearance: none; appearance: none; outline: none;
}
.pj-item:last-child { border-bottom: none; }
.pj-item:hover { background-color: #f8fafc; }
.pj-item:active { background-color: #f1f5f9; }

.pj-icon {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 14px;
    overflow: hidden; background: #f1f5f9;
    display: flex; align-items: center; justify-content: center;
}
.pj-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pj-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pj-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; min-width: 0;
}
.pj-nom {
    font-size: 0.98rem; font-weight: 700; color: #0b1220;
    letter-spacing: -0.008em; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
}
.pj-badge {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    padding: 2px 7px; font-size: 0.58rem; font-weight: 900;
    letter-spacing: 0.06em; border-radius: 5px; line-height: 1.4; white-space: nowrap;
}
.pj-badge.decouverte { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
.pj-badge.pro        { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); color: #92400e; border: 1px solid #fcd34d; }
.pj-badge.pro-plus   { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }

.pj-bottom { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pj-statut {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.78rem; font-weight: 600; white-space: nowrap;
}
.pj-statut .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.pj-statut.en-attente { color: #b45309; }
.pj-statut.en-attente .dot { background: #f59e0b; }
.pj-statut.actif { color: #047857; }
.pj-statut.actif .dot { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
.pj-statut.expire { color: #64748b; }
.pj-statut.expire .dot { background: #94a3b8; }

.pj-sep { width: 3px; height: 3px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
.pj-date { font-size: 0.78rem; font-weight: 500; color: #94a3b8; white-space: nowrap; }

/* ─── ÉTAT VIDE ─── */
.pj-empty {
    padding: 40px 24px 60px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    max-width: 400px; margin: 0 auto;
}
.pj-empty-illustration {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; position: relative;
    box-shadow: 0 20px 40px -20px rgba(16,185,129,.35), inset 0 0 0 1px rgba(16,185,129,.12);
}
.pj-empty-illustration::before,
.pj-empty-illustration::after {
    content: ""; position: absolute; border-radius: 50%;
    background: #10b981; opacity: .15;
}
.pj-empty-illustration::before { width: 16px; height: 16px; top: 8px; right: 10px; }
.pj-empty-illustration::after { width: 10px; height: 10px; bottom: 12px; left: 14px; opacity: .25; }
.pj-empty-illustration svg {
    width: 52px; height: 52px; stroke: #10b981; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    position: relative; z-index: 2;
}
.pj-empty-title {
    font-size: 1.25rem; font-weight: 800; color: #0b1220;
    letter-spacing: -0.025em; line-height: 1.3; margin-bottom: 8px;
}
.pj-empty-subtitle {
    font-size: 0.9rem; font-weight: 500; color: #64748b;
    line-height: 1.6; margin-bottom: 26px; max-width: 300px;
}
.pj-empty-hint {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600; color: #94a3b8;
    padding: 8px 14px; background: #f8fafc;
    border-radius: 20px; border: 1px solid #f1f5f9;
}
.pj-empty-hint svg {
    width: 14px; height: 14px; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}

/* ─── CHARGEMENT ─── */
.pj-loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 20px; gap: 16px;
}
.pj-loading-spinner {
    width: 40px; height: 40px; border: 3px solid #e5e5ea;
    border-top-color: #10b981; border-radius: 50%;
    animation: pjSpin .8s linear infinite;
}
@keyframes pjSpin { to { transform: rotate(360deg); } }
.pj-loading-text { font-size: 0.9rem; color: #64748b; font-weight: 500; }
</style>

<script>
(function() {

    // ─── Message d'accueil selon l'heure ───
    function getGreeting() {
        const h = new Date().getHours();
        if (h >= 5  && h < 12) return 'Bonjour 👋';
        if (h >= 12 && h < 18) return 'Bon après-midi ☀️';
        if (h >= 18 && h < 23) return 'Bonsoir 🌆';
        return 'Bonne nuit 🌙';
    }

    // ─── Initiales (2 premières lettres des 2 premiers mots) ───
    function initiales(str) {
        if (!str) return '?';
        const parties = str.trim().split(/\s+/).filter(Boolean);
        if (parties.length === 0) return '?';
        const p1 = parties[0].charAt(0).toUpperCase();
        const p2 = parties.length >= 2 ? parties[1].charAt(0).toUpperCase() : '';
        return p1 + p2;
    }

    // ─── Format date court ───
    function formatDate(ts) {
        if (!ts) return '';
        try {
            const d = new Date(ts);
            const jour = d.getDate();
            const mois = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
            return jour + ' ' + mois[d.getMonth()] + '. ' + d.getFullYear();
        } catch (e) { return ''; }
    }

    // ─── Label statut ───
    function statutInfo(statut) {
        if (statut === 'actif' || statut === 'actif_')   return { cls: 'actif',      label: 'Actif' };
        if (statut === 'expire' || statut === 'expiré')  return { cls: 'expire',     label: 'Expiré' };
        return { cls: 'en-attente', label: 'En attente' };
    }

    // ─── Label formule pour badge ───
    function formuleBadgeClass(f) {
        if (f === 'pro')      return 'pro';
        if (f === 'pro-plus') return 'pro-plus';
        return 'decouverte';
    }
    function formuleBadgeLabel(f) {
        if (f === 'pro')      return 'PRO';
        if (f === 'pro-plus') return 'PRO+';
        return 'DÉCOUVERTE';
    }

    // ─── Injecter les infos utilisateur ───
    function injecterUtilisateur() {
        const user = window._authUser;
        const greetEl = document.getElementById('pjGreeting');
        const nameEl  = document.getElementById('pjName');
        const avEl    = document.getElementById('pjAvatar');

        if (greetEl) greetEl.textContent = getGreeting();

        if (!user) return;

        const nomComplet = user.displayName || (user.email ? user.email.split('@')[0] : 'Utilisateur');
        if (nameEl) nameEl.textContent = nomComplet;
        if (avEl)   avEl.textContent = initiales(nomComplet);
    }

    // ─── Afficher l'état vide ───
    function afficherVide() {
        const c = document.getElementById('pjConteneur');
        if (!c) return;
        c.innerHTML =
            '<div class="pj-empty">' +
                '<div class="pj-empty-illustration">' +
                    '<svg viewBox="0 0 24 24">' +
                        '<rect x="3" y="3" width="7" height="7" rx="1.5"/>' +
                        '<rect x="14" y="3" width="7" height="7" rx="1.5"/>' +
                        '<rect x="3" y="14" width="7" height="7" rx="1.5"/>' +
                        '<line x1="17.5" y1="14" x2="17.5" y2="21"/>' +
                        '<line x1="14" y1="17.5" x2="21" y2="17.5"/>' +
                    '</svg>' +
                '</div>' +
                '<h2 class="pj-empty-title">Aucun projet pour le moment</h2>' +
                '<p class="pj-empty-subtitle">Créez votre 1<sup>er</sup> site installable. Et retrouvez-le ici. Avec toutes ces statistiques.</p>' +
                '<div class="pj-empty-hint">' +
                    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                    'Commencez par le bouton ci-dessus' +
                '</div>' +
            '</div>';
    }

    // ─── Afficher la liste des projets ───
    function afficherListe(projets) {
        const c = document.getElementById('pjConteneur');
        if (!c) return;

        let html = '<div class="pj-list">';
        projets.forEach(function(p) {
            const st = statutInfo(p.statut);
            const badgeCls = formuleBadgeClass(p.formule);
            const badgeLbl = formuleBadgeLabel(p.formule);
            const dateStr = formatDate(p.creeLe);

            html +=
                '<button type="button" class="pj-item" data-id="' + p.id + '">' +
                    '<div class="pj-icon">' +
                        (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="">' : '') +
                    '</div>' +
                    '<div class="pj-body">' +
                        '<div class="pj-top">' +
                            '<div class="pj-nom">' + (p.nom || 'Sans nom') + '</div>' +
                            '<span class="pj-badge ' + badgeCls + '">' + badgeLbl + '</span>' +
                        '</div>' +
                        '<div class="pj-bottom">' +
                            '<span class="pj-statut ' + st.cls + '"><span class="dot"></span>' + st.label + '</span>' +
                            (dateStr ? '<span class="pj-sep"></span><span class="pj-date">' + dateStr + '</span>' : '') +
                        '</div>' +
                    '</div>' +
                '</button>';
        });
        html += '</div>';
        c.innerHTML = html;

        // Clic sur un projet → (à venir : ouvrir les statistiques)
        c.querySelectorAll('.pj-item').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const id = this.dataset.id;
                console.log('[Projets] Clic sur projet :', id);
                // ⏳ à venir : ouvrir la page statistiques
            });
        });
    }

    // ─── Charger les projets depuis le serveur ───
    async function chargerListeProjets() {
        const c = document.getElementById('pjConteneur');
        const compteur = document.getElementById('pjCompteur');

        if (!window._authUser) {
            afficherVide();
            if (compteur) compteur.textContent = '0';
            return;
        }

        // Afficher un état de chargement
        if (c) {
            c.innerHTML = '<div class="pj-loading"><div class="pj-loading-spinner"></div><p class="pj-loading-text">Chargement de vos projets...</p></div>';
        }

        try {
            const jeton = await window._authUser.getIdToken();

            const response = await fetch('/.netlify/functions/lister-projets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jeton: jeton })
            });

            const resultat = await response.json();

            if (!resultat || !resultat.success) {
                if (typeof window.showNotification === 'function') {
                    window.showNotification((resultat && resultat.message) || "Erreur lors du chargement des projets.", 'error');
                }
                afficherVide();
                if (compteur) compteur.textContent = '0';
                return;
            }

            const projets = resultat.projets || [];

            if (projets.length === 0) {
                afficherVide();
            } else {
                afficherListe(projets);
            }
            if (compteur) compteur.textContent = String(projets.length);

        } catch (e) {
            console.error('[Projets] Erreur :', e);
            afficherVide();
            if (compteur) compteur.textContent = '0';
        }
    }

    // ─── Init (appelé par le Shell) ───
    async function init_projets() {
        injecterUtilisateur();

        // Attacher le bouton "Créer un projet" → bascule vers l'onglet Créer
        const btnCreate = document.getElementById('pjBtnCreate');
        if (btnCreate) {
            btnCreate.addEventListener('click', function() {
                const btnNav = document.getElementById('btn-create');
                if (btnNav) btnNav.click();
            });
        }

        // Charger la liste
        await chargerListeProjets();
    }

    window.init_projets = init_projets;

})();
</script>
