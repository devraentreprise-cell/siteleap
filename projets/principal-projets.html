<script>
(function() {
    'use strict';

    let tousLesProjets = [];
    let rechercheActive = '';
    let _modalSuspenduVisible = false;
    let projetSuspenduActif = null;
    let _initialise = false;

    if (!window._cacheProjetsModule) {
        window._cacheProjetsModule = { loaded: false, projets: [] };
    }

    const $ = id => document.getElementById(id);

    function echapper(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function normaliserStatut(s) {
        const v = String(s || '').toLowerCase().replace(/-/g, '_');
        if (v === 'actif') return 'actif';
        if (v === 'suspendu') return 'suspendu';
        return 'en_attente';
    }

    function normaliserFormule(f) {
        const v = String(f || 'decouverte').toLowerCase().replace(/[_\s+]/g, '-');
        if (v === 'pro') return 'pro';
        if (v === 'pro-plus' || v === 'proplus') return 'pro-plus';
        return 'decouverte';
    }

    function statutInfo(s) {
        const st = normaliserStatut(s);
        if (st === 'actif') return { cls: 'actif', label: 'Actif' };
        if (st === 'suspendu') return { cls: 'suspendu', label: 'Suspendu' };
        return { cls: 'en-attente', label: 'En attente' };
    }

    function formuleInfo(f) {
        const v = normaliserFormule(f);
        if (v === 'pro') return { cls: 'pro', label: 'PRO' };
        if (v === 'pro-plus') return { cls: 'proplus', label: 'PRO+' };
        return { cls: 'decouverte', label: 'DÉCOUVERTE' };
    }

    function getGreeting() {
        const h = new Date().getHours();
        if (h >= 5 && h < 12) return 'Bonjour 👋';
        if (h >= 12 && h < 18) return 'Bon après-midi ☀️';
        return 'Bonsoir 🌆';
    }

    function initiales(str) {
        if (!str) return '?';
        const p = str.trim().split(/\s+/).filter(Boolean);
        if (p.length === 0) return '?';
        return p[0].charAt(0).toUpperCase() +
            (p.length >= 2 ? p[1].charAt(0).toUpperCase() : '');
    }

    function formatDate(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        if (isNaN(d.getTime())) return typeof ts === 'string' ? ts : '';
        const mois = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
                      'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
        return String(d.getDate()).padStart(2, '0') + ' ' + mois[d.getMonth()] + ' ' + d.getFullYear();
    }

    function injecterUtilisateur() {
        const user = window._authUser;
        const greetEl = $('accueilSalut');
        const nameEl = $('accueilNom');
        const avEl = $('accueilAvatar');
        if (greetEl) greetEl.textContent = getGreeting();
        if (!user) return;

        let prenom;
        if (user.displayName && user.displayName.trim()) {
            prenom = user.displayName.trim().split(/\s+/)[0];
        } else if (user.email) {
            prenom = user.email.split('@')[0];
        } else {
            prenom = 'Utilisateur';
        }
        if (nameEl) nameEl.textContent = prenom;
        if (avEl) {
            const source = user.displayName || (user.email ? user.email.split('@')[0] : '');
            avEl.textContent = initiales(source);
        }
    }

    function afficherChargement() {
        const c = $('projetsConteneur');
        if (!c) return;
        c.innerHTML =
            '<div class="loading-bloc">' +
                '<div class="loading-spinner"></div>' +
                '<p class="loading-text">Chargement de vos projets...</p>' +
            '</div>';
    }

    function afficherVide() {
        const c = $('projetsConteneur');
        if (!c) return;
        c.innerHTML =
            '<div class="empty-state">' +
                '<div class="empty-illustration">' +
                    '<svg viewBox="0 0 24 24">' +
                        '<rect x="3" y="3" width="7" height="7" rx="1.5"/>' +
                        '<rect x="14" y="3" width="7" height="7" rx="1.5"/>' +
                        '<rect x="3" y="14" width="7" height="7" rx="1.5"/>' +
                        '<line x1="17.5" y1="14" x2="17.5" y2="21"/>' +
                        '<line x1="14" y1="17.5" x2="21" y2="17.5"/>' +
                    '</svg>' +
                '</div>' +
                '<h2 class="empty-title">Aucun projet pour le moment</h2>' +
                '<p class="empty-subtitle">Créez votre 1<sup>er</sup> site installable et retrouvez-le ici avec toutes ses statistiques.</p>' +
            '</div>';
    }

    function majCompteur() {
        const el = $('sectionCompteur');
        if (el) el.textContent = String(tousLesProjets.length);
    }

    function afficherListe(projets) {
        const c = $('projetsConteneur');
        if (!c) return;

        const terme = rechercheActive.toLowerCase().trim();
        const filtres = projets.filter(p => (p.nom || '').toLowerCase().includes(terme));

        if (filtres.length === 0) {
            c.innerHTML = '<div class="aucun-resultat">Aucun projet ne correspond à votre recherche.</div>';
            return;
        }

        let html = '<div class="projets-list">';
        filtres.forEach(p => {
            const st = statutInfo(p.statut);
            const fi = formuleInfo(p.formule);
            const dateStr = formatDate(p.creeLe || p.date);
            const img = p.imageUrl || p.image || '';
            const idProjet = echapper(p.id || p.nom);

            html +=
                '<button type="button" class="projet-item" data-id="' + idProjet + '">' +
                    '<div class="projet-avatar">' +
                        (img ? '<img src="' + echapper(img) + '" alt="">' : '') +
                    '</div>' +
                    '<div class="projet-body">' +
                        '<div class="projet-top">' +
                            '<div class="projet-nom">' + echapper(p.nom || 'Sans nom') + '</div>' +
                            '<span class="formule-badge ' + fi.cls + '">' + fi.label + '</span>' +
                        '</div>' +
                        '<div class="projet-bottom">' +
                            '<span class="projet-statut ' + st.cls + '"><span class="dot"></span>' + st.label + '</span>' +
                            (dateStr ? '<span class="projet-sep"></span><span class="projet-date">' + echapper(dateStr) + '</span>' : '') +
                        '</div>' +
                    '</div>' +
                '</button>';
        });
        html += '</div>';
        c.innerHTML = html;

        c.querySelectorAll('.projet-item').forEach(btn => {
            btn.addEventListener('click', () => ouvrirProjet(btn.dataset.id));
        });
    }

    async function chargerListeProjets() {
        if (!window._authUser) {
            tousLesProjets = [];
            majCompteur();
            afficherVide();
            return;
        }

        if (window._cacheProjetsModule && window._cacheProjetsModule.loaded) {
            tousLesProjets = window._cacheProjetsModule.projets || [];
            majCompteur();
            if (tousLesProjets.length === 0) afficherVide();
            else afficherListe(tousLesProjets);
            return;
        }

        afficherChargement();

        try {
            const jeton = await window._authUser.getIdToken();
            const response = await fetch('/.netlify/functions/lister-projets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jeton: jeton })
            });
            const resultat = await response.json();

            if (!resultat || !resultat.success) {
                tousLesProjets = [];
                majCompteur();
                afficherVide();
                return;
            }

            tousLesProjets = resultat.projets || [];
            window._cacheProjetsModule.loaded = true;
            window._cacheProjetsModule.projets = tousLesProjets;

            majCompteur();
            if (tousLesProjets.length === 0) afficherVide();
            else afficherListe(tousLesProjets);
        } catch (e) {
            console.error('[Projets] Erreur chargement liste :', e);
            tousLesProjets = [];
            majCompteur();
            afficherVide();
        }
    }

    function afficherModalSuspendu() {
        if (_modalSuspenduVisible) return;
        _modalSuspenduVisible = true;
        const el = $('modalSuspenduProjet');
        if (el) {
            el.classList.add('show');
            el.setAttribute('aria-hidden', 'false');
        }
    }

    function cacherModalSuspendu() {
        if (!_modalSuspenduVisible) return;
        _modalSuspenduVisible = false;
        const el = $('modalSuspenduProjet');
        if (el) {
            el.classList.remove('show');
            el.setAttribute('aria-hidden', 'true');
        }
    }

    function chargerEcran(nomEcran, projetId) {
        if (typeof window.ouvrirEcranProjet === 'function') {
            window.ouvrirEcranProjet(nomEcran, projetId);
        } else {
            console.warn('[Projets] ouvrirEcranProjet indisponible.');
        }
    }

    function ouvrirProjet(id) {
        const projet = tousLesProjets.find(p => String(p.id || p.nom) === String(id));
        if (!projet) return;

        if (normaliserStatut(projet.statut) === 'suspendu') {
            projetSuspenduActif = projet;
            afficherModalSuspendu();
            return;
        }

        chargerEcran('stats-projet', projet.id || projet.nom);
    }

    function brancherEvenements() {
        if (_initialise) return;
        _initialise = true;

        const btnCreer = $('btnCreerProjet');
        if (btnCreer) {
            btnCreer.addEventListener('click', () => {
                const navCreate = document.getElementById('btn-create');
                if (navCreate) navCreate.click();
            });
        }

        const inputRech = $('rechercheInput');
        if (inputRech) {
            inputRech.addEventListener('input', function() {
                rechercheActive = this.value;
                afficherListe(tousLesProjets);
            });
        }

        const modalClose = $('modalSuspenduProjetClose');
        if (modalClose) modalClose.addEventListener('click', cacherModalSuspendu);

        const modalPlusTard = $('modalSuspenduProjetPlusTard');
        if (modalPlusTard) modalPlusTard.addEventListener('click', cacherModalSuspendu);

        const modalDebloquer = $('modalSuspenduProjetDebloquer');
        if (modalDebloquer) {
            modalDebloquer.addEventListener('click', () => {
                cacherModalSuspendu();
                const id = projetSuspenduActif && (projetSuspenduActif.id || projetSuspenduActif.nom);
                chargerEcran('deblocage-projet', id);
            });
        }
    }

    window.init_principalProjets = async function() {
        brancherEvenements();
        injecterUtilisateur();
        await chargerListeProjets();
    };

})();
</script>
